name: Build standalone YUBSUB for macOS

on:
  pull_request:
    paths:
      - "mac_app.py"
      - "app.py"
      - "requirements.txt"
      - "static/**"
      - "mac-app/**"
      - ".github/workflows/mac-app.yml"
  push:
    branches: [main]
    paths:
      - "mac_app.py"
      - "app.py"
      - "requirements.txt"
      - "static/**"
      - "mac-app/**"
      - ".github/workflows/mac-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Mac standalone (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel
            runner: macos-15-intel
            filename: YUBSUB-macOS-Intel.zip
          - arch: Apple-Silicon
            runner: macos-15
            filename: YUBSUB-macOS-Apple-Silicon.zip
    runs-on: ${{ matrix.runner }}
    env:
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PR builds test the real Sparkle integration with a disposable test key.
      # The private half is destroyed with the runner; production release jobs
      # still require the owner's actual Actions variable and secret.
      - name: Create temporary updater test key for pull requests
        if: github.event_name == 'pull_request' && vars.SPARKLE_PUBLIC_ED_KEY == ''
        shell: bash
        run: |
          python -m pip install 'cryptography>=44,<49'
          python - <<'PY'
          import base64, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          key = Ed25519PrivateKey.generate()
          public = key.public_key().public_bytes(
              encoding=serialization.Encoding.Raw, format=serialization.PublicFormat.Raw)
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write("SPARKLE_PUBLIC_ED_KEY=" + base64.b64encode(public).decode() + "\n")
          print("Ephemeral public key prepared for Sparkle build smoke tests.")
          PY

      - name: Validate app and build scripts
        run: |
          python -m py_compile mac_app.py mac-app/make_icon.py mac-app/sparkle_updater.py
          bash -n mac-app/build_macos.sh mac-app/create_update_key.sh

      - name: Build all dependencies into YUBSUB.app
        run: bash mac-app/build_macos.sh

      - name: Package macOS .app and preserve symlinks
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/YUBSUB.app "dist/${{ matrix.filename }}"
          unzip -t -q "dist/${{ matrix.filename }}"

      - name: Upload app ZIP
        uses: actions/upload-artifact@v4
        with:
          name: YUBSUB-${{ matrix.arch }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish official macOS release
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: YUBSUB-*
          path: release
          merge-multiple: true

      - name: Require trustworthy update-signing keys
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_PRIVATE_KEY" || -z "$SPARKLE_PUBLIC_ED_KEY" ]]; then
            echo "::error::Secure updates require SPARKLE_PRIVATE_KEY (Actions secret) and SPARKLE_PUBLIC_ED_KEY (Actions variable). No unsigned release will be published."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sign archives and create authenticated Sparkle appcasts
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          python -m pip install 'cryptography>=44,<49'
          version="$(tr -d '[:space:]' < mac-app/VERSION)"
          python mac-app/sign_release.py release "$version"

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum YUBSUB-macOS-Intel.zip YUBSUB-macOS-Apple-Silicon.zip > SHA256SUMS.txt

      - name: Create official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < mac-app/VERSION)"
          tag="mac-app-v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; no changes made."
            exit 0
          fi
          gh release create "$tag" \
            release/YUBSUB-macOS-Intel.zip \
            release/YUBSUB-macOS-Apple-Silicon.zip \
            release/SHA256SUMS.txt \
            release/appcast-Intel.xml \
            release/appcast-Apple-Silicon.xml \
            --target "$GITHUB_SHA" \
            --title "YUBSUB Desktop v${version} — macOS" \
            --latest \
            --notes-file mac-app/RELEASE_NOTES.md
