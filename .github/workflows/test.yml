name: Yubsub tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m py_compile app.py
      - run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          python -c 'from pathlib import Path; h=Path("static/index.html").read_text(); Path("/tmp/yubsub.js").write_text(h.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/yubsub.js
      - name: Build production container
        run: docker build -t yubsub:test .
