name: YUBSUB checks

on:
  push:
    branches: ["feature/**", "claude/**", "main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install converter and tests
        run: python -m pip install -r requirements.txt pytest
      - name: Verify backend and archive behavior
        run: python -m pytest -q
      - name: Verify inline front-end JavaScript syntax
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.contents = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and "src" not in dict(attrs):
                      self.capture = True
              def handle_endtag(self, tag):
                  if tag == "script":
                      self.capture = False
              def handle_data(self, data):
                  if self.capture:
                      self.contents.append(data)
          parser = Scripts()
          parser.feed(Path("static/index.html").read_text())
          assert parser.contents, "Missing frontend script"
          Path("/tmp/yubsub-frontend.js").write_text("\n".join(parser.contents))
          PY
          node --check /tmp/yubsub-frontend.js
